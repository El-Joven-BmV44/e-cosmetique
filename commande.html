<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation commande</title>
    <link rel="stylesheet" href="style_categ.css">
    <!-- Inclure Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            overflow-x: hidden;
        }
        .section-carousel{
            margin-top: auto;
            box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.1);
        }
        .section-carousel h2{
            margin-top: 2.8rem;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 2px #000;
            font-family: cursive;
        }
        .login-container{
            margin-top: 8rem;
        }
        table{
            border-collapse: collapse;
            border: 1px solid black;
            width: 100%;
            text-align: center;
            font-family: "Poppins", Cambria;
        }
        tr{
            border: 1px solid black;
            height: 2rem;
        }
        th{
            border: 1px solid black;
            height: 2.2rem;
            background-color: #ffb6c1;
        }
        td{
            border: 1px solid black;
        }
        
        .cart-summary h3{
            font-size: large;
        }
        .cart-summary .souligne {
            text-transform: uppercase;
            text-decoration: underline;
        }
        .cart-summary button{
            padding: 10px;
            font-weight: bold;
            background-color: #ffb6c1;
            border: 1px solid #000;
            border-top-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
            cursor: auto;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.1);

        }
        .cart-summary button:hover{
            background-color: #f6c6cd;
            cursor: auto;

        }
    </style>
</head>
<body>
                                            <!-- ANNIMATION D'ACCUEIL -->
    <div class="section-carousel fixed-top">
        <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <!-- Annimation 1 -->
                <div class="carousel-item active">
                    <img src="img/f_w1.png" class="d-block w-100" alt="...">
                </div>
                <!-- Annimation 2 -->
                <div class="carousel-item">
                    <img src="img/f_m1.png" class="d-block w-100" alt="...">
                </div>
                <!-- Annimation 3 -->
                <div class="carousel-item">
                    <img src="img/f_w3.png" class="d-block w-100" alt="...">
                </div>
                <!-- Annimation 4 -->
                <div class="carousel-item">
                    <img src="img/f_m2.png" class="d-block w-100" alt="...">
                </div>
                <!-- Annimation 5 -->
                <div class="carousel-item">
                    <img src="img/f_w2.png" class="d-block w-100" alt="...">
                </div>
            </div>
            <div class="fixed-top">
                <h2>Vous avez fait un excellent choix !</h2>
            </div>
        </div>
    </div>

    <div class="login-container">
        <h2>Valider votre commande</h2>
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Produit</th>
                    <th>Prix</th>
                    <th>Quantité</th>
                    <th>Total</th>
                    <th>Supprimer</th>
                </tr>
            </thead>
            <tbody id="order-list"></tbody>
            <tbody id="cart-items">
                <!-- Les articles seront ajoutés ici en JS -->
            </tbody>
        </table>

        <div class="cart-summary">
            <h3><span class="souligne">Total</span> : <span id="cart-total">0</span> FCFA</h3>
            <button id="validate-order">Valider la commande</button>
        </div>
    </div>

    <script>
        // Récupération du panier depuis le localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartItems = document.getElementById("cart-items");
        const cartTotal = document.getElementById("cart-total");

        // Affichage du panier
        function displayCart() {
            cartItems.innerHTML = "";
            let total = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;

                cartItems.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.price} FCFA</td>
                        <td>
                            <input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)">
                        </td>
                        <td>${itemTotal} FCFA</td>
                        <td><button style='color:red;padding:5px' onclick="removeItem(${index})">X</button></td>
                    </tr>
                `;
            });

            cartTotal.textContent = total;
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        // Modifier la quantité
        function updateQuantity(index, quantity) {
            cart[index].quantity = parseInt(quantity);
            displayCart();
        }

        // Supprimer un produit
        function removeItem(index) {
            cart.splice(index, 1);
            displayCart();
        }

        // Validation de la commande
        document.getElementById("validate-order").addEventListener("click", function() {
            alert("Commande validée avec succès ! \n Paiement à la livraison");
            localStorage.removeItem("cart");
            window.location.href = "index.html"; // retour à la boutique
        });

        // Lancer affichage
        displayCart();
    </script>
    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
